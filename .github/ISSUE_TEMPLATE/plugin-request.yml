name: Plugin request
description: A plugin you would like to see in the catalog.
labels: [enhancement]
body:
  - type: input
    id: name
    attributes:
      label: Plugin
      description: Its name and, if it exists, its repository.
    validations:
      required: true
  - type: dropdown
    id: cli
    attributes:
      label: CLI
      options: [Claude Code, Codex, Both]
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it would do for you
      description: The problem it solves, in a few lines. No secrets or private project names.
    validations:
      required: true
