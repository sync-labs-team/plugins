name: Bug report
description: The catalog does not add, list or install a plugin as the README says.
labels: [bug]
body:
  - type: input
    id: cli
    attributes:
      label: CLI and version
      description: For example "Claude Code 2.1.330" or "Codex 0.170.0".
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example "Windows 11".
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you ran
      description: The commands, in order. No secrets, client or project names, or private paths.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The exact output, and what you expected instead.
    validations:
      required: true
